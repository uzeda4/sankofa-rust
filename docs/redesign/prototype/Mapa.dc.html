<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mapa de telas e ondas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0F0E11}</style>
</helmet>
<div style="width:620px;height:1230px;box-sizing:border-box;padding:36px;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;gap:22px;overflow:hidden">
  <div style="display:flex;flex-direction:column;gap:6px">
    <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,240,234,.72)">O que existe no Komikku</span>
    <h2 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em">Telas a refazer, em cinco ondas</h2>
  </div>

  <sc-for list="{{waves}}" as="w" hint-placeholder-count="3">
    <div style="border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;background:{{w.soft}};border:1px solid {{w.line}}">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:{{w.color}};color:#0F0E11;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:16px">{{w.n}}</span>
        <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:20px">{{w.title}}</span>
        <span style="margin-left:auto;font-size:13px;font-weight:700;color:{{w.color}}">{{w.state}}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{w.items}}" as="it" hint-placeholder-count="4">
          <span style="height:34px;padding:0 14px;border-radius:17px;display:flex;align-items:center;font-size:14px;font-weight:500;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)">{{it}}</span>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <div style="display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5;color:rgba(244,240,234,.78)">
    <span style="font-weight:700;color:#F4F0EA">Base técnica mantida</span>
    <span>domain, data, source-api e source-local seguem iguais. Só a camada de apresentação (presentation e presentation-core) é substituída.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":620,"height":1230}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      waves: [
        { n: '1', title: 'Núcleo', state: 'Protótipo pronto', color: '#F2A65A', soft: 'rgba(242,166,90,.10)', line: 'rgba(242,166,90,.4)',
          items: ['Biblioteca', 'Detalhes do mangá', 'Reader e barras', 'Navegação inferior', 'Tema por capa'] },
        { n: '2', title: 'Descoberta e rotina', state: 'Protótipo pronto', color: '#7CF0C9', soft: 'rgba(124,240,201,.08)', line: 'rgba(124,240,201,.32)',
          items: ['Explorar', 'Fontes', 'Extensões', 'Navegar na fonte', 'Atualizações', 'Histórico', 'Feed', 'Migrar fonte'] },
        { n: '3', title: 'Sistema e extras', state: 'Protótipo pronto', color: '#8FB4FF', soft: 'rgba(143,180,255,.08)', line: 'rgba(143,180,255,.32)',
          items: ['Mais', 'Aparência e 3D', 'Trackers', 'Downloads', 'Categorias', 'Estatísticas', 'Backup', 'Webview', 'Erros de atualização'] },
        { n: '4', title: 'Busca e reader', state: 'Protótipo pronto', color: '#FF6B8B', soft: 'rgba(255,107,139,.08)', line: 'rgba(255,107,139,.32)',
          items: ['Busca global', 'Configurações do reader'] },
        { n: '5', title: 'Complementos', state: 'Protótipo pronto', color: '#F4D58D', soft: 'rgba(244,213,141,.08)', line: 'rgba(244,213,141,.32)',
          items: ['Detalhes da fonte', 'Escolher correspondência', 'Armazenamento', 'Recomendações', 'Primeiros passos', 'Diálogos', 'Widgets', 'Tela de erro'] }
      ]
    };
  }
}
</script>
</body>
</html>
