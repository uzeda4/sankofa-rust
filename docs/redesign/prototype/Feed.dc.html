<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Feed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=Shippori+Mincho+B1:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 90% -6%,rgba(124,240,201,.3),transparent 62%),radial-gradient(90% 45% at 0% 45%,rgba(15,43,42,.9),transparent 70%),#0F0E11"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:28px 16px 130px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px">

    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,240,234,.72)">Todas as fontes</span>
        <h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em">Feed</h1>
      </div>
      <button aria-label="Salvar busca no feed" style="height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#F4F0EA;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(14px)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Salvar busca
      </button>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;background:{{r.soft}};color:{{r.color}};font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:18px">{{r.mono}}</span>
          <span style="display:flex;flex-direction:column;flex:1;min-width:0">
            <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:19px;line-height:1.1">{{r.name}}</span>
            <span style="font-size:13px;color:rgba(244,240,234,.72)">{{r.lang}} · {{r.modeLabel}}</span>
          </span>
          <button onClick="{{r.flip}}" aria-label="Alternar entre populares e recentes" style="height:44px;padding:0 14px;border-radius:14px;border:1px solid {{r.line}};background:{{r.soft}};color:{{r.color}};font-weight:800;font-size:13.5px">{{r.flipLabel}}</button>
        </div>
        <div class="scroll" style="display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px">
          <sc-for list="{{r.items}}" as="m" hint-placeholder-count="5">
            <div style="flex:none;width:118px;display:flex;flex-direction:column;gap:8px">
              <div style="position:relative;width:118px;height:177px;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,{{m.c1}},{{m.c2}});box-shadow:0 12px 18px -12px rgba(0,0,0,.8)">
                <div style="position:absolute;left:{{m.sx}}%;top:{{m.sy}}%;width:62%;aspect-ratio:1;border-radius:50%;background:{{m.accent}}"></div>
                <div style="position:absolute;inset:auto 0 0 0;height:48%;background:{{m.c1}};clip-path:{{m.clip}}"></div>
                <div style="position:absolute;right:8px;top:8px;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:20px;line-height:1;writing-mode:vertical-rl">{{m.kanji}}</div>
              </div>
              <span style="font-weight:700;font-size:14px;line-height:1.2">{{m.title}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Navegação principal" style="position:absolute;left:16px;right:16px;bottom:18px;height:68px;border-radius:26px;padding:6px;box-sizing:border-box;display:flex;gap:4px;background:rgba(24,22,28,.62);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 20px 40px -12px rgba(0,0,0,.6)">
    <sc-for list="{{dock}}" as="n" hint-placeholder-count="5">
      <a href="{{n.href}}" aria-label="{{n.label}}" style="flex:1;min-width:0;border-radius:20px;background:{{n.bg}};color:{{n.fg}};text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transform:{{n.tf}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>
        <span style="font-size:11px;font-weight:700">{{n.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const modes = S.modes || {};
    const rgba = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const covers = [
      { title: 'Maré de Cinzas', kanji: '灰', c1: '#1B3A4B', c2: '#0B1820', accent: '#F2A65A', sx: 18, sy: 12, clip: 'polygon(0 55%,18% 30%,36% 52%,58% 18%,80% 46%,100% 28%,100% 100%,0 100%)' },
      { title: 'Estação Kitsune 9', kanji: '狐', c1: '#3B1F4A', c2: '#150B1C', accent: '#FF6B8B', sx: 30, sy: 20, clip: 'polygon(0 40%,25% 60%,50% 25%,75% 55%,100% 35%,100% 100%,0 100%)' },
      { title: 'Ronin Neon', kanji: '浪', c1: '#0F2B2A', c2: '#050F0F', accent: '#7CF0C9', sx: 8, sy: 28, clip: 'polygon(0 62%,30% 40%,52% 58%,100% 22%,100% 100%,0 100%)' },
      { title: 'Café Lua de Papel', kanji: '月', c1: '#4A3A2A', c2: '#1E1710', accent: '#F4D58D', sx: 34, sy: 8, clip: 'polygon(0 48%,40% 62%,70% 30%,100% 50%,100% 100%,0 100%)' },
      { title: 'Clube do Último Sino', kanji: '鐘', c1: '#1F2A55', c2: '#0A0E24', accent: '#8FB4FF', sx: 14, sy: 22, clip: 'polygon(0 35%,22% 52%,48% 30%,70% 58%,100% 40%,100% 100%,0 100%)' },
      { title: 'Lótus de Ferro', kanji: '蓮', c1: '#3A1414', c2: '#150606', accent: '#FF5A4E', sx: 28, sy: 30, clip: 'polygon(0 58%,35% 34%,60% 56%,82% 24%,100% 44%,100% 100%,0 100%)' }
    ];
    const sources = [
      { name: 'Aurora Scans', lang: 'PT-BR', color: '#F2A65A', off: 0 },
      { name: 'Ponte Leste', lang: 'EN', color: '#7CF0C9', off: 2 },
      { name: 'Hoshi Reader', lang: 'JA', color: '#8FB4FF', off: 4 }
    ];
    const rows = sources.map((s, i) => {
      const pop = !modes[i];
      const rot = (s.off + (pop ? 0 : 3)) % covers.length;
      return {
        name: s.name, lang: s.lang, color: s.color, mono: s.name.charAt(0),
        soft: rgba(s.color, 0.18), line: rgba(s.color, 0.5),
        modeLabel: pop ? 'Populares' : 'Recentes',
        flipLabel: pop ? 'Ver recentes' : 'Ver populares',
        items: covers.slice(rot).concat(covers.slice(0, rot)),
        flip: () => { const m = Object.assign({}, modes); m[i] = !m[i]; this.setState({ modes: m }); }
      };
    });
    const nav = [
      { label: 'Estante', d: 'M4 4h5v16H4zM10 4h5v16h-5zM16.3 5.2l4.4 1.2-3.9 14-4.4-1.2z', href: 'Main.dc.html' },
      { label: 'Novos', d: 'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5', href: 'Atualizacoes.dc.html' },
      { label: 'Histórico', d: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z', href: 'Historico.dc.html' },
      { label: 'Explorar', d: 'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM15.5 8.5l-2 5-5 2 2-5z', href: 'Explorar.dc.html' },
      { label: 'Mais', d: 'M5 12h.01M12 12h.01M19 12h.01', href: 'Mais.dc.html' }
    ];
    const dock = nav.map((n, i) => ({
      label: n.label, d: n.d, href: n.href,
      bg: i === 3 ? 'rgba(124,240,201,.22)' : 'transparent',
      fg: i === 3 ? '#7CF0C9' : 'rgba(244,240,234,.78)',
      tf: i === 3 ? 'translateY(-3px) scale(1.04)' : 'translateY(0) scale(1)'
    }));
    return { rows, dock };
  }
}
</script>
</body>
</html>
