<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Trackers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 90% -6%,rgba(244,213,141,.3),transparent 62%),radial-gradient(90% 45% at 0% 50%,rgba(74,58,42,.85),transparent 70%),#0F0E11"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:20px 16px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <div style="display:flex;align-items:center;gap:12px">
      <a href="Mais.dc.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(14px);color:#F4F0EA;display:grid;place-items:center;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.01em">Trackers</h1>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{opts}}" as="t" hint-placeholder-count="2">
        <button onClick="{{t.toggle}}" role="switch" aria-checked="{{t.on}}" style="min-height:64px;padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#F4F0EA;display:flex;align-items:center;gap:12px;text-align:left">
          <span style="display:flex;flex-direction:column;gap:1px;flex:1">
            <span style="font-weight:700;font-size:15.5px">{{t.label}}</span>
            <span style="font-size:13px;color:rgba(244,240,234,.72)">{{t.hint}}</span>
          </span>
          <span style="width:52px;height:30px;border-radius:15px;background:{{t.bg}};position:relative;transition:background 250ms ease"><span style="position:absolute;top:3px;left:{{t.left}}px;width:24px;height:24px;border-radius:50%;background:{{t.knob}};transition:left 250ms cubic-bezier(.2,.8,.2,1)"></span></span>
        </button>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,240,234,.72);font-weight:700">Serviços</span>
      <sc-for list="{{services}}" as="s" hint-placeholder-count="6">
        <div style="display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid {{s.line}};transition:border-color 300ms ease">
          <span style="width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;background:{{s.soft}};color:{{s.color}};font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:20px">{{s.mono}}</span>
          <span style="display:flex;flex-direction:column;gap:1px;flex:1;min-width:0">
            <span style="font-weight:700;font-size:16px">{{s.name}}</span>
            <span style="font-size:13px;color:{{s.noteColor}}">{{s.note}}</span>
          </span>
          <button onClick="{{s.toggle}}" style="height:44px;min-width:104px;padding:0 14px;border-radius:14px;border:1px solid {{s.border}};background:{{s.bg}};color:{{s.fg}};font-weight:800;font-size:14px;transition:all 300ms ease">{{s.label}}</button>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const conn = S.conn || { 0: true, 1: true };
    const flags = S.flags || { 0: true, 1: false };
    const rgba = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const defs = [
      { name: 'MyAnimeList', color: '#8FB4FF' },
      { name: 'AniList', color: '#7CF0C9' },
      { name: 'Kitsu', color: '#FF6B8B' },
      { name: 'MangaUpdates', color: '#F4D58D' },
      { name: 'Shikimori', color: '#F2A65A' },
      { name: 'Bangumi', color: '#FF5A4E' }
    ];
    const services = defs.map((d, i) => {
      const on = !!conn[i];
      return {
        name: d.name, color: d.color, mono: d.name.charAt(0),
        soft: rgba(d.color, 0.18),
        line: on ? rgba(d.color, 0.5) : 'rgba(255,255,255,.1)',
        note: on ? 'Conectado · sincronizado há 3 min' : 'Desconectado',
        noteColor: on ? d.color : 'rgba(244,240,234,.72)',
        label: on ? 'Desconectar' : 'Conectar',
        bg: on ? 'transparent' : d.color,
        fg: on ? '#F4F0EA' : '#0F0E11',
        border: on ? 'rgba(255,255,255,.2)' : d.color,
        toggle: () => { const c = Object.assign({}, conn); c[i] = !c[i]; this.setState({ conn: c }); }
      };
    });
    const labels = [
      { label: 'Sincronização em 2 vias', hint: 'Traz o progresso do tracker para o app' },
      { label: 'Atualizar ao terminar o capítulo', hint: 'Envia o progresso sem perguntar' }
    ];
    const opts = labels.map((t, i) => ({
      label: t.label, hint: t.hint, on: !!flags[i],
      bg: flags[i] ? '#F4D58D' : 'rgba(255,255,255,.18)',
      left: flags[i] ? 25 : 3,
      knob: flags[i] ? '#0F0E11' : '#F4F0EA',
      toggle: () => { const f = Object.assign({}, flags); f[i] = !f[i]; this.setState({ flags: f }); }
    }));
    return { services, opts };
  }
}
</script>
</body>
</html>
