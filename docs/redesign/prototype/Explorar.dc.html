<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Explorar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=Shippori+Mincho+B1:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
input::placeholder{color:rgba(244,240,234,.62)}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:{{atmo}};transition:background 700ms ease"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:28px 16px 130px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,240,234,.72)">Descobrir</span>
      <h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em">Explorar</h1>
    </div>

    <!-- search -->
    <div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 16px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px)">
      <a href="Busca.dc.html" aria-label="Abrir busca global" style="width:28px;height:44px;display:grid;place-items:center;color:#F4F0EA">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3"/></svg>
      </a>
      <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar em todas as fontes</label>
      <input id="q" type="search" placeholder="Buscar em todas as fontes" style="flex:1;min-width:0;height:44px;background:transparent;border:0;outline:0;color:#F4F0EA;font-family:inherit;font-size:15px">
      <a href="Feed.dc.html" style="height:40px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.1);color:#F4F0EA;font-size:13px;font-weight:700;text-decoration:none;display:flex;align-items:center">Feed</a>
      <a href="Fontes.dc.html" style="height:40px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.1);color:#F4F0EA;font-size:13px;font-weight:700;text-decoration:none;display:flex;align-items:center">6 fontes</a>
    </div>

    <!-- genres -->
    <div class="scroll" style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px">
      <sc-for list="{{genres}}" as="g" hint-placeholder-count="5">
        <button onClick="{{g.pick}}" style="flex:none;height:44px;padding:0 18px;border-radius:22px;border:1px solid {{g.border}};background:{{g.bg}};color:{{g.fg}};font-size:14px;font-weight:700;transition:all 300ms ease">{{g.label}}</button>
      </sc-for>
    </div>

    <!-- cover flow -->
    <div style="position:relative;height:310px;perspective:900px;margin:0 -16px;overflow:hidden">
      <sc-for list="{{flow}}" as="c" hint-placeholder-count="6">
        <button onClick="{{c.pick}}" aria-label="{{c.title}}" style="position:absolute;left:50%;top:6px;margin-left:-95px;width:190px;height:285px;padding:0;border:0;background:none;transform:{{c.tf}};opacity:{{c.op}};z-index:{{c.z}};pointer-events:{{c.pe}};filter:{{c.fil}};transition:transform 600ms cubic-bezier(.2,.8,.2,1),opacity 400ms ease,filter 400ms ease">
          <div style="position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,{{c.c1}},{{c.c2}});box-shadow:{{c.shadow}}">
            <div style="position:absolute;left:{{c.sx}}%;top:{{c.sy}}%;width:62%;aspect-ratio:1;border-radius:50%;background:{{c.accent}}"></div>
            <div style="position:absolute;inset:0;opacity:.28;background:radial-gradient(circle,rgba(0,0,0,.6) 1.2px,transparent 1.6px) 0 0/8px 8px;-webkit-mask-image:linear-gradient(200deg,#000,transparent 60%);mask-image:linear-gradient(200deg,#000,transparent 60%)"></div>
            <div style="position:absolute;inset:auto 0 0 0;height:48%;background:{{c.c1}};clip-path:{{c.clip}}"></div>
            <div style="position:absolute;right:12px;top:12px;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:32px;line-height:1;writing-mode:vertical-rl;color:#F4F0EA;text-shadow:0 2px 10px rgba(0,0,0,.45)">{{c.kanji}}</div>
          </div>
        </button>
      </sc-for>
    </div>

    <!-- focused info -->
    <div style="display:flex;align-items:center;gap:12px">
      <div style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:0">
        <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:26px;line-height:1.05;letter-spacing:-.01em">{{cur.title}}</span>
        <span style="font-size:14px;color:rgba(244,240,234,.74)">{{cur.genre}} · via {{cur.source}}</span>
      </div>
      <button onClick="{{prev}}" aria-label="Anterior" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#F4F0EA;display:grid;place-items:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button onClick="{{next}}" aria-label="Próximo" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#F4F0EA;display:grid;place-items:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <button onClick="{{toggleAdd}}" style="height:52px;border-radius:18px;border:1px solid {{addBorder}};background:{{addBg}};color:{{addFg}};font-weight:800;font-size:15.5px;transition:all 300ms ease;box-shadow:{{addShadow}}">{{addLabel}}</button>

    <!-- row -->
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:20px">Em alta nas suas fontes</span>
        <a href="Navegar.dc.html" style="font-size:14px;font-weight:700;color:{{accent}};text-decoration:none;min-height:44px;display:flex;align-items:center">Ver tudo</a>
      </div>
      <div class="scroll" style="display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 8px">
        <sc-for list="{{mini}}" as="m" hint-placeholder-count="5">
          <div style="flex:none;width:124px;display:flex;flex-direction:column;gap:8px">
            <div style="position:relative;width:124px;height:186px;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,{{m.c1}},{{m.c2}});box-shadow:0 12px 18px -12px rgba(0,0,0,.8)">
              <div style="position:absolute;left:{{m.sx}}%;top:{{m.sy}}%;width:62%;aspect-ratio:1;border-radius:50%;background:{{m.accent}}"></div>
              <div style="position:absolute;inset:auto 0 0 0;height:48%;background:{{m.c1}};clip-path:{{m.clip}}"></div>
              <div style="position:absolute;right:8px;top:8px;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:20px;line-height:1;writing-mode:vertical-rl">{{m.kanji}}</div>
            </div>
            <span style="font-weight:700;font-size:14px;line-height:1.2">{{m.title}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- dock -->
  <nav aria-label="Navegação principal" style="position:absolute;left:16px;right:16px;bottom:18px;height:68px;border-radius:26px;padding:6px;box-sizing:border-box;display:flex;gap:4px;background:rgba(24,22,28,.62);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 20px 40px -12px rgba(0,0,0,.6)">
    <sc-for list="{{dock}}" as="n" hint-placeholder-count="5">
      <a href="{{n.href}}" aria-label="{{n.label}}" style="flex:1;min-width:0;border-radius:20px;background:{{n.bg}};color:{{n.fg}};text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transform:{{n.tf}};transition:all 300ms cubic-bezier(.2,.8,.2,1)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>
        <span style="font-size:11px;font-weight:700">{{n.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const f = S.focus ?? 0;
    const gen = S.genre ?? 0;
    const added = S.added || { 2: true };
    const rgba = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const data = [
      { title: 'Maré de Cinzas', genre: 'Drama', source: 'Aurora Scans', kanji: '灰', c1: '#1B3A4B', c2: '#0B1820', accent: '#F2A65A', sx: 18, sy: 12, clip: 'polygon(0 55%,18% 30%,36% 52%,58% 18%,80% 46%,100% 28%,100% 100%,0 100%)' },
      { title: 'Estação Kitsune 9', genre: 'Mistério', source: 'Sakura Leitura', kanji: '狐', c1: '#3B1F4A', c2: '#150B1C', accent: '#FF6B8B', sx: 30, sy: 20, clip: 'polygon(0 40%,25% 60%,50% 25%,75% 55%,100% 35%,100% 100%,0 100%)' },
      { title: 'Ronin Neon', genre: 'Ação', source: 'Ponte Leste', kanji: '浪', c1: '#0F2B2A', c2: '#050F0F', accent: '#7CF0C9', sx: 8, sy: 28, clip: 'polygon(0 62%,30% 40%,52% 58%,100% 22%,100% 100%,0 100%)' },
      { title: 'Café Lua de Papel', genre: 'Slice of life', source: 'Tinta Aberta', kanji: '月', c1: '#4A3A2A', c2: '#1E1710', accent: '#F4D58D', sx: 34, sy: 8, clip: 'polygon(0 48%,40% 62%,70% 30%,100% 50%,100% 100%,0 100%)' },
      { title: 'Clube do Último Sino', genre: 'Fantasia', source: 'Hoshi Reader', kanji: '鐘', c1: '#1F2A55', c2: '#0A0E24', accent: '#8FB4FF', sx: 14, sy: 22, clip: 'polygon(0 35%,22% 52%,48% 30%,70% 58%,100% 40%,100% 100%,0 100%)' },
      { title: 'Lótus de Ferro', genre: 'Ação', source: 'Mercado de Papel', kanji: '蓮', c1: '#3A1414', c2: '#150606', accent: '#FF5A4E', sx: 28, sy: 30, clip: 'polygon(0 58%,35% 34%,60% 56%,82% 24%,100% 44%,100% 100%,0 100%)' }
    ];
    const flow = data.map((d, i) => {
      const off = i - f, a = Math.abs(off);
      return Object.assign({}, d, {
        tf: 'translate3d(' + (off * 82) + 'px,0,' + (-a * 100) + 'px) rotateY(' + (-off * 36) + 'deg) scale(' + (a === 0 ? 1 : 0.92) + ')',
        op: a > 2 ? 0 : 1 - a * 0.26,
        z: 10 - a,
        pe: a > 2 ? 'none' : 'auto',
        fil: a === 0 ? 'none' : 'brightness(.72)',
        shadow: a === 0 ? '0 30px 40px -16px ' + rgba(d.accent, 0.65) : '0 14px 22px -14px rgba(0,0,0,.8)',
        pick: () => this.setState({ focus: i })
      });
    });
    const cur = data[f];
    const isAdded = !!added[f];
    const genres = ['Tudo', 'Ação', 'Drama', 'Fantasia', 'Slice of life', 'Mistério'].map((label, i) => ({
      label,
      pick: () => this.setState({ genre: i }),
      bg: gen === i ? cur.accent : 'rgba(255,255,255,.08)',
      fg: gen === i ? '#0F0E11' : '#F4F0EA',
      border: gen === i ? cur.accent : 'rgba(255,255,255,.14)'
    }));
    const nav = [
      { label: 'Estante', d: 'M4 4h5v16H4zM10 4h5v16h-5zM16.3 5.2l4.4 1.2-3.9 14-4.4-1.2z', href: 'Main.dc.html' },
      { label: 'Novos', d: 'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5', href: 'Atualizacoes.dc.html' },
      { label: 'Histórico', d: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z', href: 'Historico.dc.html' },
      { label: 'Explorar', d: 'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM15.5 8.5l-2 5-5 2 2-5z', href: 'Explorar.dc.html' },
      { label: 'Mais', d: 'M5 12h.01M12 12h.01M19 12h.01', href: 'Mais.dc.html' }
    ];
    const dock = nav.map((n, i) => ({
      label: n.label, d: n.d, href: n.href,
      bg: i === 3 ? rgba(cur.accent, 0.22) : 'transparent',
      fg: i === 3 ? cur.accent : 'rgba(244,240,234,.78)',
      tf: i === 3 ? 'translateY(-3px) scale(1.04)' : 'translateY(0) scale(1)'
    }));
    return {
      flow, cur, genres, dock,
      accent: cur.accent,
      mini: data.slice(2).concat(data.slice(0, 2)),
      atmo: 'radial-gradient(120% 55% at 50% 12%,' + rgba(cur.accent, 0.4) + ',transparent 62%),radial-gradient(90% 50% at 100% 55%,' + rgba(cur.c1, 0.9) + ',transparent 70%),#0F0E11',
      prev: () => this.setState({ focus: (f + data.length - 1) % data.length }),
      next: () => this.setState({ focus: (f + 1) % data.length }),
      toggleAdd: () => { const a = Object.assign({}, added); a[f] = !a[f]; this.setState({ added: a }); },
      addLabel: isAdded ? 'Na biblioteca' : 'Adicionar à biblioteca',
      addBg: isAdded ? rgba(cur.accent, 0.18) : cur.accent,
      addFg: isAdded ? cur.accent : '#0F0E11',
      addBorder: isAdded ? rgba(cur.accent, 0.6) : cur.accent,
      addShadow: isAdded ? 'none' : '0 16px 26px -14px ' + cur.accent
    };
  }
}
</script>
</body>
</html>
