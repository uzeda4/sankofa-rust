<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Busca global</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=Shippori+Mincho+B1:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
input::placeholder{color:rgba(244,240,234,.62)}
@keyframes kkshimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.06) 0,rgba(255,255,255,.18) 50%,rgba(255,255,255,.06) 100%);background-size:200% 100%;animation:kkshimmer 1.5s linear infinite}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 50% -8%,rgba(242,166,90,.3),transparent 62%),radial-gradient(90% 45% at 100% 50%,rgba(27,58,75,.85),transparent 70%),#0F0E11"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:20px 16px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <!-- search bar -->
    <div style="display:flex;align-items:center;gap:10px">
      <a href="Explorar.dc.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(14px);color:#F4F0EA;display:grid;place-items:center;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 16px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid {{barLine}};backdrop-filter:blur(16px);transition:border-color 300ms ease">
        <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar em todas as fontes</label>
        <input id="q" type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Buscar em todas as fontes" style="flex:1;min-width:0;height:44px;background:transparent;border:0;outline:0;color:#F4F0EA;font-family:inherit;font-size:16px">
        <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{clear}}" aria-label="Limpar busca" style="width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:#F4F0EA;display:grid;place-items:center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </sc-if>
      </div>
    </div>

    <!-- scope -->
    <div class="scroll" style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px">
      <sc-for list="{{scopes}}" as="s" hint-placeholder-count="4">
        <button onClick="{{s.pick}}" style="flex:none;height:44px;padding:0 18px;border-radius:22px;border:1px solid {{s.border}};background:{{s.bg}};color:{{s.fg}};font-size:14px;font-weight:700;transition:all 300ms ease">{{s.label}}</button>
      </sc-for>
    </div>

    <!-- recents (no query) -->
    <sc-if value="{{showRecents}}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,240,234,.72);font-weight:700">Buscas recentes</span>
        <div style="display:flex;flex-direction:column;gap:6px">
          <sc-for list="{{recents}}" as="r" hint-placeholder-count="3">
            <button onClick="{{r.pick}}" style="min-height:52px;padding:0 14px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#F4F0EA;display:flex;align-items:center;gap:12px;font-size:15.5px;font-weight:700;text-align:left">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(244,240,234,.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
              {{r.label}}
            </button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <!-- results -->
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:{{g.soft}};color:{{g.color}};font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:15px">{{g.mono}}</span>
          <span style="font-weight:700;font-size:16px;flex:1">{{g.name}}</span>
          <span style="font-size:13px;color:rgba(244,240,234,.72)">{{g.status}}</span>
        </div>
        <sc-for list="{{g.items}}" as="m" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)">
            <span style="position:relative;width:52px;height:78px;flex:none;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,{{m.c1}},{{m.c2}})">
              <span style="position:absolute;left:{{m.sx}}%;top:{{m.sy}}%;width:62%;aspect-ratio:1;border-radius:50%;background:{{m.accent}}"></span>
              <span style="position:absolute;inset:auto 0 0 0;height:48%;background:{{m.c1}};clip-path:{{m.clip}}"></span>
              <span style="position:absolute;right:4px;top:4px;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:14px;line-height:1;writing-mode:vertical-rl">{{m.kanji}}</span>
            </span>
            <span style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
              <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:17px;line-height:1.1">{{m.title}}</span>
              <span style="font-size:13px;color:rgba(244,240,234,.72)">{{m.genre}} · {{m.ch}} capítulos</span>
            </span>
            <button onClick="{{m.toggle}}" aria-label="{{m.label}}" style="width:44px;height:44px;border-radius:14px;border:1px solid {{m.border}};background:{{m.bg}};color:{{m.fg}};display:grid;place-items:center;flex:none;transition:all 250ms ease">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"/></svg>
            </button>
          </div>
        </sc-for>
        <sc-if value="{{g.loading}}" hint-placeholder-val="{{ false }}">
          <div class="sk" style="height:94px;border-radius:20px" aria-label="Buscando"></div>
        </sc-if>
      </div>
    </sc-for>

    <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
      <div style="padding:30px 20px;border-radius:22px;border:1px dashed rgba(255,255,255,.22);text-align:center;display:flex;flex-direction:column;gap:6px">
        <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:18px">Nada encontrado</span>
        <span style="font-size:14px;color:rgba(244,240,234,.74)">Tente outro nome ou amplie o escopo para todas as fontes.</span>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const q = S.q ?? '';
    const scope = S.scope ?? 0;
    const added = S.added || { 0: true };
    const rgba = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const items = [
      { id: 0, src: 0, title: 'Maré de Cinzas', genre: 'Drama', ch: 88, kanji: '灰', c1: '#1B3A4B', c2: '#0B1820', accent: '#F2A65A', sx: 18, sy: 12, clip: 'polygon(0 55%,18% 30%,36% 52%,58% 18%,80% 46%,100% 28%,100% 100%,0 100%)' },
      { id: 1, src: 1, title: 'Estação Kitsune 9', genre: 'Mistério', ch: 42, kanji: '狐', c1: '#3B1F4A', c2: '#150B1C', accent: '#FF6B8B', sx: 30, sy: 20, clip: 'polygon(0 40%,25% 60%,50% 25%,75% 55%,100% 35%,100% 100%,0 100%)' },
      { id: 2, src: 2, title: 'Ronin Neon', genre: 'Ação', ch: 128, kanji: '浪', c1: '#0F2B2A', c2: '#050F0F', accent: '#7CF0C9', sx: 8, sy: 28, clip: 'polygon(0 62%,30% 40%,52% 58%,100% 22%,100% 100%,0 100%)' },
      { id: 3, src: 0, title: 'Café Lua de Papel', genre: 'Slice of life', ch: 19, kanji: '月', c1: '#4A3A2A', c2: '#1E1710', accent: '#F4D58D', sx: 34, sy: 8, clip: 'polygon(0 48%,40% 62%,70% 30%,100% 50%,100% 100%,0 100%)' },
      { id: 4, src: 1, title: 'Clube do Último Sino', genre: 'Fantasia', ch: 64, kanji: '鐘', c1: '#1F2A55', c2: '#0A0E24', accent: '#8FB4FF', sx: 14, sy: 22, clip: 'polygon(0 35%,22% 52%,48% 30%,70% 58%,100% 40%,100% 100%,0 100%)' },
      { id: 5, src: 2, title: 'Lótus de Ferro', genre: 'Ação', ch: 203, kanji: '蓮', c1: '#3A1414', c2: '#150606', accent: '#FF5A4E', sx: 28, sy: 30, clip: 'polygon(0 58%,35% 34%,60% 56%,82% 24%,100% 44%,100% 100%,0 100%)' }
    ];
    const sources = [
      { name: 'Aurora Scans', color: '#F2A65A', lang: 'PT-BR' },
      { name: 'Sakura Leitura', color: '#FF6B8B', lang: 'PT-BR' },
      { name: 'Ponte Leste', color: '#7CF0C9', lang: 'EN' }
    ];
    const scopes = ['Todas as fontes', 'Minha estante', 'PT-BR', 'EN'].map((label, i) => ({
      label, pick: () => this.setState({ scope: i }),
      bg: scope === i ? '#F2A65A' : 'rgba(255,255,255,.08)',
      fg: scope === i ? '#0F0E11' : '#F4F0EA',
      border: scope === i ? '#F2A65A' : 'rgba(255,255,255,.14)'
    }));
    const hasQ = q.trim().length > 0;
    const nq = norm(q.trim());
    const langOk = (s) => scope === 2 ? s.lang === 'PT-BR' : (scope === 3 ? s.lang === 'EN' : true);
    const groups = !hasQ ? [] : sources.map((s, si) => {
      const list = items
        .filter((m) => m.src === si && norm(m.title).indexOf(nq) !== -1)
        .filter((m) => scope !== 1 || !!added[m.id])
        .map((m) => {
          const on = !!added[m.id];
          return Object.assign({}, m, {
            label: on ? 'Remover da estante' : 'Adicionar à estante',
            icon: on ? 'M5 12.5l4.5 4.5L19 7.5' : 'M12 5v14M5 12h14',
            bg: on ? rgba(m.accent, 0.2) : 'transparent',
            fg: on ? m.accent : '#F4F0EA',
            border: on ? rgba(m.accent, 0.6) : 'rgba(255,255,255,.2)',
            toggle: () => { const a = Object.assign({}, added); a[m.id] = !a[m.id]; this.setState({ added: a }); }
          });
        });
      return {
        name: s.name, color: s.color, mono: s.name.charAt(0), soft: rgba(s.color, 0.18),
        items: list,
        status: list.length + (list.length === 1 ? ' resultado' : ' resultados'),
        loading: si === 2 && scope !== 1,
        visible: langOk(s) && (list.length > 0 || (si === 2 && scope !== 1))
      };
    }).filter((g) => g.visible);
    const hasAny = groups.some((g) => g.items.length > 0);
    return {
      q, hasQ, scopes, groups,
      barLine: hasQ ? 'rgba(242,166,90,.7)' : 'rgba(255,255,255,.14)',
      showRecents: !hasQ,
      recents: ['maré', 'neon', 'café', 'lótus'].map((label) => ({ label, pick: () => this.setState({ q: label }) })),
      noResults: hasQ && !hasAny && !groups.some((g) => g.loading),
      setQ: (e) => this.setState({ q: e.target.value }),
      clear: () => this.setState({ q: '' })
    };
  }
}
</script>
</body>
</html>
