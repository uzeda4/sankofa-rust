<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Categorias</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 85% -6%,rgba(143,180,255,.3),transparent 62%),radial-gradient(90% 45% at 0% 50%,rgba(31,42,85,.85),transparent 70%),#0F0E11"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:20px 16px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <div style="display:flex;align-items:center;gap:12px">
      <a href="Mais.dc.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(14px);color:#F4F0EA;display:grid;place-items:center;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.01em">Categorias</h1>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <div style="min-height:68px;padding:8px 8px 8px 14px;border-radius:20px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);opacity:{{c.op}};transition:opacity 300ms ease">
          <span style="width:10px;height:36px;border-radius:5px;background:{{c.color}};flex:none"></span>
          <span style="display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;padding-left:6px">
            <span style="font-weight:700;font-size:16px">{{c.name}}</span>
            <span style="font-size:13px;color:rgba(244,240,234,.72)">{{c.count}} títulos{{c.hiddenNote}}</span>
          </span>
          <button onClick="{{c.hide}}" aria-label="{{c.hideLabel}}" aria-pressed="{{c.isHidden}}" style="width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:#F4F0EA;display:grid;place-items:center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.eye}}"/></svg>
          </button>
          <span style="display:flex;flex-direction:column">
            <button onClick="{{c.up}}" aria-label="Subir {{c.name}}" style="width:44px;height:30px;border:0;background:transparent;color:#F4F0EA;display:grid;place-items:center;opacity:{{c.upOp}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
            </button>
            <button onClick="{{c.down}}" aria-label="Descer {{c.name}}" style="width:44px;height:30px;border:0;background:transparent;color:#F4F0EA;display:grid;place-items:center;opacity:{{c.downOp}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </span>
        </div>
      </sc-for>
    </div>
  </div>

  <button onClick="{{add}}" style="position:absolute;left:16px;right:16px;bottom:20px;height:56px;border-radius:20px;border:0;background:#8FB4FF;color:#0F0E11;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 18px 30px -12px rgba(143,180,255,.7)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Nova categoria
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const list = S.list || [
      { id: 'a', name: 'Lendo', count: 6, color: '#F2A65A' },
      { id: 'b', name: 'Para ler', count: 14, color: '#8FB4FF' },
      { id: 'c', name: 'Completos', count: 9, color: '#7CF0C9' },
      { id: 'd', name: 'Favoritos', count: 5, color: '#FF6B8B' },
      { id: 'e', name: 'Adulto', count: 3, color: '#FF5A4E' }
    ];
    const hid = S.hid || { e: true };
    const swap = (i, j) => {
      if (j < 0 || j >= list.length) return;
      const n = list.slice();
      const t = n[i]; n[i] = n[j]; n[j] = t;
      this.setState({ list: n });
    };
    const cats = list.map((c, i) => {
      const h = !!hid[c.id];
      return {
        name: c.name, count: c.count, color: c.color,
        isHidden: h,
        hiddenNote: h ? ' · oculta' : '',
        op: h ? 0.55 : 1,
        hideLabel: h ? 'Mostrar ' + c.name : 'Ocultar ' + c.name,
        eye: h ? 'M3 3l18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 8.5 4 9.5 6a12 12 0 0 1-2.6 3.3M6.1 7.6A12 12 0 0 0 2.5 12c1 2 4.5 6 9.5 6a9.4 9.4 0 0 0 3.2-.6' : 'M2.5 12c1-2 4.5-6 9.5-6s8.5 4 9.5 6c-1 2-4.5 6-9.5 6s-8.5-4-9.5-6zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
        upOp: i === 0 ? 0.25 : 1,
        downOp: i === list.length - 1 ? 0.25 : 1,
        hide: () => { const o = Object.assign({}, hid); o[c.id] = !o[c.id]; this.setState({ hid: o }); },
        up: () => swap(i, i - 1),
        down: () => swap(i, i + 1)
      };
    });
    return {
      cats,
      add: () => {
        const n = list.concat([{ id: 'n' + list.length, name: 'Categoria ' + (list.length + 1), count: 0, color: '#F4D58D' }]);
        this.setState({ list: n });
      }
    };
  }
}
</script>
</body>
</html>
