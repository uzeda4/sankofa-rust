<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Erros de atualização</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 50% -8%,rgba(255,90,78,.3),transparent 62%),radial-gradient(90% 45% at 0% 55%,rgba(58,20,20,.85),transparent 70%),#0F0E11"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:20px 16px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <div style="display:flex;align-items:center;gap:12px">
      <a href="Mais.dc.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(14px);color:#F4F0EA;display:grid;place-items:center;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div style="display:flex;flex-direction:column">
        <h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.01em">Erros de atualização</h1>
        <span style="font-size:13.5px;color:rgba(244,240,234,.74)">{{summary}}</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{errors}}" as="e" hint-placeholder-count="4">
        <div style="border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.06);border:1px solid {{e.line}}">
          <div style="display:flex;align-items:flex-start;gap:12px">
            <span style="width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;background:{{e.soft}};color:{{e.color}}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v5m0 4h.01M10.3 4.3L3 17a2 2 0 0 0 1.7 3h14.6A2 2 0 0 0 21 17L13.7 4.3a2 2 0 0 0-3.4 0z"/></svg>
            </span>
            <span style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
              <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:18px;line-height:1.1">{{e.title}}</span>
              <span style="font-size:13px;color:rgba(244,240,234,.72)">{{e.source}}</span>
              <span style="font-size:14px;font-weight:700;color:{{e.color}};margin-top:2px">{{e.msg}}</span>
            </span>
          </div>
          <div style="display:flex;gap:8px">
            <a href="{{e.href}}" style="flex:1;height:44px;border-radius:14px;background:{{e.color}};color:#0F0E11;font-weight:800;font-size:14px;text-decoration:none;display:flex;align-items:center;justify-content:center">{{e.action}}</a>
            <button onClick="{{e.dismiss}}" style="height:44px;padding:0 16px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#F4F0EA;font-weight:700;font-size:14px">Dispensar</button>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding:34px 20px;border-radius:22px;border:1px dashed rgba(255,255,255,.22);text-align:center;display:flex;flex-direction:column;gap:6px">
          <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:18px">Tudo certo por aqui</span>
          <span style="font-size:14px;color:rgba(244,240,234,.74)">Nenhum título com erro na última atualização.</span>
        </div>
      </sc-if>
    </div>
  </div>

  <button onClick="{{retryAll}}" style="position:absolute;left:16px;right:16px;bottom:20px;height:56px;border-radius:20px;border:0;background:#F4F0EA;color:#0F0E11;font-weight:800;font-size:16px;opacity:{{retryOp}}">Tentar todos de novo</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const gone = S.gone || {};
    const rgba = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const base = [
      { title: 'Lótus de Ferro', source: 'Mercado de Papel', msg: 'Verificação de segurança necessária', color: '#F2A65A', action: 'Abrir no webview', href: 'Webview.dc.html' },
      { title: 'Estação Kitsune 9', source: 'Sakura Leitura', msg: 'Fonte fora do ar', color: '#FF5A4E', action: 'Migrar de fonte', href: 'Migrar.dc.html' },
      { title: 'Café Lua de Papel', source: 'Tinta Aberta', msg: 'Título removido pela fonte', color: '#FF5A4E', action: 'Migrar de fonte', href: 'Migrar.dc.html' },
      { title: 'Clube do Último Sino', source: 'Hoshi Reader', msg: 'Tempo esgotado ao buscar capítulos', color: '#8FB4FF', action: 'Tentar de novo', href: '#' }
    ];
    const errors = base.map((d, i) => Object.assign({}, d, {
      id: i,
      soft: rgba(d.color, 0.18),
      line: rgba(d.color, 0.4),
      dismiss: () => { const g = Object.assign({}, gone); g[i] = true; this.setState({ gone: g }); }
    })).filter((d) => !gone[d.id]);
    return {
      errors,
      empty: errors.length === 0,
      retryOp: errors.length === 0 ? 0.4 : 1,
      summary: errors.length === 0 ? 'Sem erros' : errors.length + (errors.length === 1 ? ' título com problema' : ' títulos com problema'),
      retryAll: () => this.setState({ gone: { 0: true, 1: true, 2: true, 3: true } })
    };
  }
}
</script>
</body>
</html>
