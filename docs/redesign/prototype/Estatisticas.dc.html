<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estatísticas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 90% -6%,rgba(255,107,139,.3),transparent 62%),radial-gradient(90% 45% at 0% 50%,rgba(59,31,74,.85),transparent 70%),#0F0E11"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:20px 16px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <div style="display:flex;align-items:center;gap:12px">
      <a href="Mais.dc.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(14px);color:#F4F0EA;display:grid;place-items:center;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.01em">Estatísticas</h1>
    </div>

    <!-- period -->
    <div style="display:flex;padding:4px;gap:4px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)">
      <sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
        <button onClick="{{p.pick}}" style="flex:1;height:44px;border-radius:14px;border:0;background:{{p.bg}};color:{{p.fg}};font-weight:700;font-size:14px;transition:all 300ms ease">{{p.label}}</button>
      </sc-for>
    </div>

    <!-- summary -->
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <sc-for list="{{summary}}" as="s" hint-placeholder-count="3">
        <div style="border-radius:20px;padding:14px 12px;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)">
          <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:26px;line-height:1.05;color:{{s.color}}">{{s.value}}</span>
          <span style="font-size:12.5px;color:rgba(244,240,234,.76)">{{s.label}}</span>
        </div>
      </sc-for>
    </div>

    <!-- bars -->
    <div style="border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)">
      <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:18px">Capítulos por dia</span>
      <div style="height:150px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
          <div style="height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px">
            <span style="font-size:12.5px;font-weight:700">{{b.v}}</span>
            <span style="width:100%;height:{{b.h}}px;border-radius:10px 10px 4px 4px;background:{{b.color}};transition:height 600ms cubic-bezier(.2,.8,.2,1)"></span>
          </div>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;text-align:center;font-size:12.5px;color:rgba(244,240,234,.74)">
        <span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span>
      </div>
    </div>

    <!-- genres -->
    <div style="border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)">
      <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:18px">Gêneros mais lidos</span>
      <sc-for list="{{genres}}" as="g" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700"><span>{{g.name}}</span><span style="color:{{g.color}}">{{g.pct}}%</span></div>
          <span style="height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden"><span style="display:block;width:{{g.pct}}%;height:100%;border-radius:4px;background:{{g.color}};transition:width 600ms cubic-bezier(.2,.8,.2,1)"></span></span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const per = S.per ?? 0;
    const data = [
      { days: [3, 5, 2, 7, 4, 9, 6], sum: ['36', '12 h', '9'], g: [38, 27, 21, 14] },
      { days: [14, 22, 18, 30, 25, 40, 28], sum: ['177', '58 h', '24'], g: [34, 30, 22, 14] },
      { days: [120, 160, 140, 210, 190, 260, 230], sum: ['1.310', '412 h', '88'], g: [30, 28, 24, 18] }
    ][per];
    const max = Math.max.apply(null, data.days);
    const palette = ['#F2A65A', '#FF6B8B', '#7CF0C9', '#8FB4FF'];
    const bars = data.days.map((v, i) => ({
      v, h: Math.round(v / max * 96) + 8,
      color: v === max ? '#FF6B8B' : 'rgba(255,107,139,.45)'
    }));
    const names = ['Ação', 'Drama', 'Fantasia', 'Mistério'];
    const genres = data.g.map((p, i) => ({ name: names[i], pct: p, color: palette[i] }));
    const summary = [
      { value: data.sum[0], label: 'Capítulos lidos', color: '#FF6B8B' },
      { value: data.sum[1], label: 'Tempo de leitura', color: '#F2A65A' },
      { value: data.sum[2], label: 'Títulos ativos', color: '#7CF0C9' }
    ];
    const periods = ['Semana', 'Mês', 'Ano'].map((label, i) => ({
      label, pick: () => this.setState({ per: i }),
      bg: per === i ? '#FF6B8B' : 'transparent', fg: per === i ? '#0F0E11' : '#F4F0EA'
    }));
    return { periods, summary, bars, genres };
  }
}
</script>
</body>
</html>
