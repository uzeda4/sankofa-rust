<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Downloads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 10% -6%,rgba(124,240,201,.3),transparent 62%),radial-gradient(90% 45% at 100% 50%,rgba(15,43,42,.9),transparent 70%),#0F0E11"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:20px 16px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <div style="display:flex;align-items:center;gap:12px">
      <a href="Mais.dc.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(14px);color:#F4F0EA;display:grid;place-items:center;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.01em;flex:1">Downloads</h1>
      <a href="Armazenamento.dc.html" style="height:44px;padding:0 14px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#F4F0EA;font-weight:700;font-size:14px;text-decoration:none;display:flex;align-items:center">Armazenamento</a>
    </div>

    <!-- storage -->
    <div style="border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px)">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:26px">3,2 GB</span>
        <span style="font-size:13.5px;color:rgba(244,240,234,.74)">usados por capítulos baixados</span>
      </div>
      <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:rgba(255,255,255,.1)">
        <span style="width:46%;background:#7CF0C9"></span>
        <span style="width:22%;background:#F2A65A"></span>
        <span style="width:12%;background:#8FB4FF"></span>
      </div>
      <div style="display:flex;gap:14px;font-size:12.5px;color:rgba(244,240,234,.78)">
        <span>Maré de Cinzas</span><span>Ronin Neon</span><span>Outros</span>
      </div>
    </div>

    <!-- controls -->
    <div style="display:flex;gap:10px">
      <button onClick="{{togglePause}}" style="flex:1;height:52px;border-radius:18px;border:0;background:{{pauseBg}};color:{{pauseFg}};font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{pauseIcon}}"/></svg>
        {{pauseLabel}}
      </button>
      <button onClick="{{clearAll}}" style="height:52px;padding:0 18px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#F4F0EA;font-weight:700;font-size:15px">Limpar fila</button>
    </div>

    <!-- queue -->
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,240,234,.72);font-weight:700">Na fila · {{count}}</span>
      <sc-for list="{{items}}" as="d" hint-placeholder-count="3">
        <div style="padding:12px 8px 12px 14px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px">
          <span style="display:flex;flex-direction:column;gap:8px;flex:1;min-width:0">
            <span style="display:flex;flex-direction:column;gap:1px">
              <span style="font-weight:700;font-size:15.5px">{{d.title}}</span>
              <span style="font-size:13px;color:rgba(244,240,234,.72)">Cap. {{d.ch}} · {{d.status}}</span>
            </span>
            <span style="height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden"><span style="display:block;width:{{d.pct}}%;height:100%;border-radius:3px;background:{{d.bar}};transition:background 300ms ease"></span></span>
          </span>
          <button onClick="{{d.cancel}}" aria-label="Cancelar {{d.title}}" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#F4F0EA;display:grid;place-items:center;flex:none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding:30px 20px;border-radius:22px;border:1px dashed rgba(255,255,255,.22);text-align:center;display:flex;flex-direction:column;gap:6px">
          <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:18px">Fila vazia</span>
          <span style="font-size:14px;color:rgba(244,240,234,.74)">Capítulos que você baixar aparecem aqui.</span>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const paused = !!S.paused;
    const gone = S.gone || {};
    const base = [
      { title: 'Maré de Cinzas', ch: 90, pct: 72 },
      { title: 'Maré de Cinzas', ch: 89, pct: 35 },
      { title: 'Ronin Neon', ch: 129, pct: 8 },
      { title: 'Lótus de Ferro', ch: 205, pct: 0 }
    ];
    const items = base.map((d, i) => Object.assign({}, d, {
      id: i,
      status: paused ? 'Pausado · ' + d.pct + '%' : (d.pct === 0 ? 'Aguardando' : 'Baixando · ' + d.pct + '%'),
      bar: paused ? 'rgba(255,255,255,.4)' : '#7CF0C9',
      cancel: () => { const g = Object.assign({}, gone); g[i] = true; this.setState({ gone: g }); }
    })).filter((d) => !gone[d.id]);
    return {
      items,
      count: items.length,
      empty: items.length === 0,
      pauseLabel: paused ? 'Retomar tudo' : 'Pausar tudo',
      pauseIcon: paused ? 'M7 4.5v15l12-7.5z' : 'M7 4h3.5v16H7zM13.5 4H17v16h-3.5z',
      pauseBg: paused ? '#7CF0C9' : 'rgba(255,255,255,.12)',
      pauseFg: paused ? '#0F0E11' : '#F4F0EA',
      togglePause: () => this.setState({ paused: !paused }),
      clearAll: () => this.setState({ gone: { 0: true, 1: true, 2: true, 3: true } })
    };
  }
}
</script>
</body>
</html>
