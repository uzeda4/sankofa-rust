<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Escolher correspondência</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=Shippori+Mincho+B1:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 20% -6%,rgba(143,180,255,.3),transparent 62%),radial-gradient(90% 45% at 100% 55%,rgba(31,42,85,.85),transparent 70%),#0F0E11"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:20px 16px 130px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <div style="display:flex;align-items:center;gap:12px">
      <a href="Migrar.dc.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(14px);color:#F4F0EA;display:grid;place-items:center;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div style="display:flex;flex-direction:column">
        <span style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,240,234,.72)">Escolher correspondência</span>
        <h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:26px;line-height:1.05">Clube do Último Sino</h1>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3"/></svg>
      <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar outro título</label>
      <input id="q" type="search" placeholder="Buscar outro título em Aurora Scans" style="flex:1;min-width:0;height:44px;background:transparent;border:0;outline:0;color:#F4F0EA;font-family:inherit;font-size:15px">
    </div>

    <div style="display:flex;flex-direction:column;gap:10px" role="radiogroup" aria-label="Candidatos">
      <sc-for list="{{cands}}" as="c" hint-placeholder-count="3">
        <button onClick="{{c.pick}}" role="radio" aria-checked="{{c.on}}" style="padding:10px 12px 10px 10px;border-radius:22px;border:2px solid {{c.ring}};background:{{c.bg}};color:#F4F0EA;display:flex;align-items:center;gap:12px;text-align:left;transition:all 250ms ease;transform:{{c.tf}}">
          <span style="position:relative;width:56px;height:84px;flex:none;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,{{c.c1}},{{c.c2}})">
            <span style="position:absolute;left:{{c.sx}}%;top:{{c.sy}}%;width:62%;aspect-ratio:1;border-radius:50%;background:{{c.accent}}"></span>
            <span style="position:absolute;inset:auto 0 0 0;height:48%;background:{{c.c1}};clip-path:{{c.clip}}"></span>
            <span style="position:absolute;right:4px;top:4px;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:14px;line-height:1;writing-mode:vertical-rl">{{c.kanji}}</span>
          </span>
          <span style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:0">
            <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:17px;line-height:1.1">{{c.title}}</span>
            <span style="font-size:13px;color:rgba(244,240,234,.74)">{{c.meta}}</span>
            <span style="height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden"><span style="display:block;width:{{c.pct}}%;height:100%;border-radius:3px;background:{{c.accent}}"></span></span>
          </span>
          <span style="font-weight:800;font-size:15px;color:{{c.accent}}">{{c.pct}}%</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:16px;right:16px;bottom:20px;display:flex;gap:10px">
    <button style="flex:1;height:56px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(24,22,28,.7);backdrop-filter:blur(24px);color:#F4F0EA;font-weight:700;font-size:15.5px">Ignorar</button>
    <a href="Migrar.dc.html" style="flex:2;height:56px;border-radius:20px;background:#8FB4FF;color:#0F0E11;font-weight:800;font-size:16px;text-decoration:none;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 30px -12px rgba(143,180,255,.7)">Usar esta correspondência</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const sel = S.sel ?? 0;
    const rgba = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const raw = [
      { title: 'Clube do Último Sino', meta: '64 capítulos · concluído', pct: 96, kanji: '鐘', c1: '#1F2A55', c2: '#0A0E24', accent: '#8FB4FF', sx: 14, sy: 22, clip: 'polygon(0 35%,22% 52%,48% 30%,70% 58%,100% 40%,100% 100%,0 100%)' },
      { title: 'O Último Sino da Vila', meta: '12 capítulos · em publicação', pct: 58, kanji: '鈴', c1: '#2A2A3B', c2: '#101018', accent: '#F4D58D', sx: 30, sy: 14, clip: 'polygon(0 50%,30% 30%,55% 55%,100% 30%,100% 100%,0 100%)' },
      { title: 'Sinos de Inverno', meta: '31 capítulos · pausado', pct: 34, kanji: '雪', c1: '#26363F', c2: '#0C1318', accent: '#7CF0C9', sx: 10, sy: 30, clip: 'polygon(0 60%,40% 36%,70% 58%,100% 40%,100% 100%,0 100%)' }
    ];
    const cands = raw.map((c, i) => Object.assign({}, c, {
      on: sel === i,
      ring: sel === i ? c.accent : 'rgba(255,255,255,.1)',
      bg: sel === i ? rgba(c.accent, 0.14) : 'rgba(255,255,255,.06)',
      tf: sel === i ? 'translateY(-2px)' : 'translateY(0)',
      pick: () => this.setState({ sel: i })
    }));
    return { cands };
  }
}
</script>
</body>
</html>
