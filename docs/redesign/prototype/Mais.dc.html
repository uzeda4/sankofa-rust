<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mais</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 50% -8%,rgba(242,166,90,.34),transparent 62%),radial-gradient(90% 45% at 0% 55%,rgba(27,58,75,.85),transparent 70%),#0F0E11"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:28px 16px 130px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em">Mais</h1>

    <!-- app card -->
    <div style="border-radius:26px;padding:18px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(242,166,90,.3),rgba(27,58,75,.7));border:1px solid rgba(242,166,90,.4);backdrop-filter:blur(18px)">
      <span style="width:56px;height:56px;border-radius:18px;background:#F2A65A;display:grid;place-items:center">
        <span style="width:26px;height:26px;border-radius:50%;background:#0F0E11"></span>
      </span>
      <span style="display:flex;flex-direction:column;gap:2px">
        <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.05">Komikku Redesign</span>
        <span style="font-size:13.5px;color:rgba(244,240,234,.8)">Fork v0 · protótipo</span>
      </span>
    </div>

    <!-- quick toggles -->
    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
        <button onClick="{{t.toggle}}" role="switch" aria-checked="{{t.on}}" style="min-height:64px;padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#F4F0EA;display:flex;align-items:center;gap:12px;text-align:left">
          <span style="display:flex;flex-direction:column;gap:1px;flex:1">
            <span style="font-weight:700;font-size:15.5px">{{t.label}}</span>
            <span style="font-size:13px;color:rgba(244,240,234,.72)">{{t.hint}}</span>
          </span>
          <span style="width:52px;height:30px;border-radius:15px;background:{{t.bg}};position:relative;transition:background 250ms ease"><span style="position:absolute;top:3px;left:{{t.left}}px;width:24px;height:24px;border-radius:50%;background:{{t.knob}};transition:left 250ms cubic-bezier(.2,.8,.2,1)"></span></span>
        </button>
      </sc-for>
    </div>

    <!-- menu -->
    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="7">
        <a href="{{m.href}}" style="min-height:64px;padding:8px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#F4F0EA;text-decoration:none;display:flex;align-items:center;gap:14px">
          <span style="width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:{{m.soft}};color:{{m.color}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"/></svg>
          </span>
          <span style="display:flex;flex-direction:column;gap:1px;flex:1;min-width:0">
            <span style="font-weight:700;font-size:16px">{{m.label}}</span>
            <span style="font-size:13px;color:rgba(244,240,234,.72)">{{m.hint}}</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(244,240,234,.6)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Navegação principal" style="position:absolute;left:16px;right:16px;bottom:18px;height:68px;border-radius:26px;padding:6px;box-sizing:border-box;display:flex;gap:4px;background:rgba(24,22,28,.62);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 20px 40px -12px rgba(0,0,0,.6)">
    <sc-for list="{{dock}}" as="n" hint-placeholder-count="5">
      <a href="{{n.href}}" aria-label="{{n.label}}" style="flex:1;min-width:0;border-radius:20px;background:{{n.bg}};color:{{n.fg}};text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transform:{{n.tf}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>
        <span style="font-size:11px;font-weight:700">{{n.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const on = S.on || { 0: false, 1: false };
    const rgba = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const toggles = [
      { label: 'Modo incógnito', hint: 'Não grava histórico de leitura' },
      { label: 'Somente baixados', hint: 'Mostra só o que está no aparelho' }
    ].map((t, i) => ({
      label: t.label, hint: t.hint, on: !!on[i],
      bg: on[i] ? '#F2A65A' : 'rgba(255,255,255,.18)',
      left: on[i] ? 25 : 3,
      knob: on[i] ? '#0F0E11' : '#F4F0EA',
      toggle: () => { const o = Object.assign({}, on); o[i] = !o[i]; this.setState({ on: o }); }
    }));
    const menu = [
      { label: 'Downloads', hint: '3 na fila', color: '#7CF0C9', href: 'Downloads.dc.html', d: 'M12 4v12m0 0l-5-5m5 5l5-5M5 20h14' },
      { label: 'Categorias', hint: '5 categorias', color: '#8FB4FF', href: 'Categorias.dc.html', d: 'M4 6h16M4 12h16M4 18h10' },
      { label: 'Estatísticas', hint: 'Seu tempo de leitura', color: '#FF6B8B', href: 'Estatisticas.dc.html', d: 'M5 20V10M12 20V4M19 20v-7' },
      { label: 'Trackers', hint: '2 conectados', color: '#F4D58D', href: 'Trackers.dc.html', d: 'M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18zM12 7v5l3 2' },
      { label: 'Aparência', hint: 'Tema por capa, 3D e movimento', color: '#F2A65A', href: 'Config.dc.html', d: 'M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2 0-1.2-1-1.6-1-2.8 0-1 .8-1.7 1.9-1.7H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z' },
      { label: 'Backup', hint: 'Último há 2 dias', color: '#7CF0C9', href: 'Backup.dc.html', d: 'M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 9.5 4 4 0 0 1 17 18zM12 11v6m0-6l-2.5 2.5M12 11l2.5 2.5' },
      { label: 'Erros de atualização', hint: '4 títulos com problema', color: '#FF5A4E', href: 'Erros.dc.html', d: 'M12 8v5m0 4h.01M10.3 4.3L3 17a2 2 0 0 0 1.7 3h14.6A2 2 0 0 0 21 17L13.7 4.3a2 2 0 0 0-3.4 0z' }
    ].map((m) => Object.assign({}, m, { soft: rgba(m.color, 0.16) }));
    const nav = [
      { label: 'Estante', d: 'M4 4h5v16H4zM10 4h5v16h-5zM16.3 5.2l4.4 1.2-3.9 14-4.4-1.2z', href: 'Main.dc.html' },
      { label: 'Novos', d: 'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5', href: 'Atualizacoes.dc.html' },
      { label: 'Histórico', d: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z', href: 'Historico.dc.html' },
      { label: 'Explorar', d: 'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM15.5 8.5l-2 5-5 2 2-5z', href: 'Explorar.dc.html' },
      { label: 'Mais', d: 'M5 12h.01M12 12h.01M19 12h.01', href: 'Mais.dc.html' }
    ];
    const dock = nav.map((n, i) => ({
      label: n.label, d: n.d, href: n.href,
      bg: i === 4 ? 'rgba(242,166,90,.22)' : 'transparent',
      fg: i === 4 ? '#F2A65A' : 'rgba(244,240,234,.78)',
      tf: i === 4 ? 'translateY(-3px) scale(1.04)' : 'translateY(0) scale(1)'
    }));
    return { toggles, menu, dock };
  }
}
</script>
</body>
</html>
