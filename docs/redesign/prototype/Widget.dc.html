<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Widgets da tela inicial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=Shippori+Mincho+B1:wght@700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0F0E11}</style>
</helmet>
<div style="width:700px;height:844px;box-sizing:border-box;padding:48px 40px;background:radial-gradient(120% 60% at 20% 0%,#3B3566,transparent 60%),radial-gradient(100% 60% at 90% 80%,#5A2E4A,transparent 60%),#15131C;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;gap:36px">

  <div style="display:flex;flex-direction:column;gap:4px">
    <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,240,234,.72)">Widgets · tela inicial do Android</span>
    <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:34px;line-height:1.05">Leitura à vista, sem abrir o app</span>
  </div>

  <!-- 4x2 -->
  <div style="display:flex;flex-direction:column;gap:12px">
    <span style="font-size:14px;font-weight:700;color:rgba(244,240,234,.8)">4×2 · Continuar lendo</span>
    <div style="width:420px;height:180px;border-radius:32px;padding:16px;box-sizing:border-box;display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,rgba(27,58,75,.95),rgba(11,24,32,.95));border:1px solid rgba(242,166,90,.4);box-shadow:0 30px 40px -24px rgba(0,0,0,.8)">
      <div style="position:relative;width:96px;height:148px;flex:none;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#1B3A4B,#0B1820);box-shadow:0 16px 24px -12px #F2A65A">
        <div style="position:absolute;left:18%;top:12%;width:62%;aspect-ratio:1;border-radius:50%;background:#F2A65A"></div>
        <div style="position:absolute;inset:auto 0 0 0;height:48%;background:#1B3A4B;clip-path:polygon(0 55%,18% 30%,36% 52%,58% 18%,80% 46%,100% 28%,100% 100%,0 100%)"></div>
        <div style="position:absolute;right:7px;top:7px;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:20px;line-height:1;writing-mode:vertical-rl">灰</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;flex:1;min-width:0">
        <span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#F2A65A;font-weight:700">Continuar lendo</span>
        <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.05">Maré de Cinzas</span>
        <span style="font-size:13.5px;color:rgba(244,240,234,.78)">Cap. 87 · pág. 12 de 31</span>
        <span style="height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden"><span style="display:block;width:38%;height:100%;background:#F2A65A"></span></span>
      </div>
    </div>
  </div>

  <div style="display:flex;gap:40px;align-items:flex-start">
    <!-- 2x2 -->
    <div style="display:flex;flex-direction:column;gap:12px">
      <span style="font-size:14px;font-weight:700;color:rgba(244,240,234,.8)">2×2 · Novos capítulos</span>
      <div style="width:180px;height:180px;border-radius:32px;padding:14px;box-sizing:border-box;position:relative;background:linear-gradient(135deg,rgba(59,31,74,.95),rgba(21,11,28,.95));border:1px solid rgba(255,107,139,.4);box-shadow:0 30px 40px -24px rgba(0,0,0,.8);overflow:hidden">
        <div style="position:absolute;right:-14px;top:18px;width:70px;height:104px;border-radius:12px;background:linear-gradient(160deg,#0F2B2A,#050F0F);transform:rotate(10deg)"></div>
        <div style="position:absolute;right:20px;top:12px;width:70px;height:104px;border-radius:12px;background:linear-gradient(160deg,#3B1F4A,#150B1C);border:1px solid rgba(255,255,255,.14);transform:rotate(-6deg)"></div>
        <div style="position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:2px">
          <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:38px;line-height:1;color:#FF6B8B">3</span>
          <span style="font-size:13.5px;font-weight:700">novos capítulos</span>
        </div>
      </div>
    </div>
    <!-- 2x1 -->
    <div style="display:flex;flex-direction:column;gap:12px">
      <span style="font-size:14px;font-weight:700;color:rgba(244,240,234,.8)">2×1 · Atalho</span>
      <div style="width:180px;height:84px;border-radius:28px;padding:0 18px;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:rgba(24,22,28,.88);border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 30px -20px rgba(0,0,0,.8)">
        <span style="width:44px;height:44px;border-radius:16px;background:#7CF0C9;display:grid;place-items:center;color:#0F0E11">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM15.5 8.5l-2 5-5 2 2-5z"/></svg>
        </span>
        <span style="font-weight:800;font-size:16px">Explorar</span>
      </div>
      <span style="font-size:13px;line-height:1.5;color:rgba(244,240,234,.72);max-width:200px">Widgets não suportam 3D nem blur confiável. Usam cor sólida da capa e cantos de 28–32 dp.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":700,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
