<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Migrar fonte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 50% -8%,rgba(242,166,90,.3),transparent 62%),radial-gradient(90% 45% at 100% 50%,rgba(27,58,75,.85),transparent 70%),#0F0E11"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:20px 16px 130px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <div style="display:flex;align-items:center;gap:12px">
      <a href="Fontes.dc.html" aria-label="Voltar para fontes" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(14px);color:#F4F0EA;display:grid;place-items:center;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.01em">Migrar fonte</h1>
    </div>

    <!-- from -> to -->
    <div style="position:relative;border-radius:26px;padding:16px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);perspective:700px">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;transform:rotateY(14deg);text-align:center">
        <span style="width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:rgba(255,107,139,.18);color:#FF6B8B;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:26px">S</span>
        <span style="font-weight:700;font-size:15px">Sakura Leitura</span>
        <span style="font-size:12.5px;color:rgba(244,240,234,.72)">Origem · {{count}} títulos</span>
      </div>
      <span style="width:44px;height:44px;border-radius:22px;flex:none;display:grid;place-items:center;background:{{arrowBg}};color:#0F0E11;transition:all 400ms ease">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5l5 5-5 5"/></svg>
      </span>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;transform:rotateY(-14deg);text-align:center">
        <span style="width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:rgba(242,166,90,.18);color:#F2A65A;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:26px">A</span>
        <span style="font-weight:700;font-size:15px">Aurora Scans</span>
        <span style="font-size:12.5px;color:rgba(244,240,234,.72)">Destino · PT-BR</span>
      </div>
    </div>

    <!-- options -->
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,240,234,.72);font-weight:700">O que levar junto</span>
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
        <button onClick="{{o.toggle}}" role="switch" aria-checked="{{o.on}}" style="min-height:56px;padding:8px 14px;border-radius:18px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#F4F0EA;display:flex;align-items:center;gap:12px;text-align:left">
          <span style="flex:1;font-weight:700;font-size:15px">{{o.label}}</span>
          <span style="width:52px;height:30px;border-radius:15px;background:{{o.bg}};position:relative;transition:background 250ms ease"><span style="position:absolute;top:3px;left:{{o.left}}px;width:24px;height:24px;border-radius:50%;background:{{o.knob}};transition:left 250ms cubic-bezier(.2,.8,.2,1)"></span></span>
        </button>
      </sc-for>
    </div>

    <!-- matches -->
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,240,234,.72);font-weight:700">Correspondências</span>
        <a href="MigrarManual.dc.html" style="min-height:44px;display:flex;align-items:center;font-size:14px;font-weight:700;color:#F2A65A;text-decoration:none">Escolher manualmente</a>
      </div>
      <sc-for list="{{matches}}" as="m" hint-placeholder-count="4">
        <button onClick="{{m.toggle}}" aria-pressed="{{m.on}}" style="min-height:64px;padding:8px 14px;border-radius:18px;border:1px solid {{m.line}};background:rgba(255,255,255,.06);color:#F4F0EA;display:flex;align-items:center;gap:12px;text-align:left;opacity:{{m.op}};transition:all 300ms ease">
          <span style="display:flex;flex-direction:column;gap:1px;flex:1;min-width:0">
            <span style="font-weight:700;font-size:15px">{{m.title}}</span>
            <span style="font-size:12.5px;color:{{m.noteColor}}">{{m.note}}</span>
          </span>
          <span style="width:28px;height:28px;border-radius:14px;display:grid;place-items:center;background:{{m.tickBg}};color:#0F0E11">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.tick}}"/></svg>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <!-- CTA -->
  <div style="position:absolute;left:16px;right:16px;bottom:20px;display:flex;flex-direction:column;gap:8px">
    <sc-if value="{{running}}" hint-placeholder-val="{{ false }}">
      <div style="height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden"><div style="width:{{pct}}%;height:100%;background:#F2A65A;transition:width 600ms ease"></div></div>
    </sc-if>
    <button onClick="{{go}}" style="height:56px;border-radius:20px;border:0;background:{{ctaBg}};color:{{ctaFg}};font-weight:800;font-size:16px;box-shadow:0 18px 30px -12px rgba(242,166,90,.7);transition:all 300ms ease">{{ctaLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const opt = S.opt || { 0: true, 1: true, 2: true, 3: false };
    const off = S.off || {};
    const phase = S.phase ?? 0; // 0 idle, 1 running, 2 done
    const rows = [
      { title: 'Estação Kitsune 9', status: 'ok', note: 'Encontrado · 42 capítulos' },
      { title: 'Café Lua de Papel', status: 'ok', note: 'Encontrado · 19 capítulos' },
      { title: 'Clube do Último Sino', status: 'review', note: 'Revisar · 2 resultados parecidos' },
      { title: 'Lótus de Ferro', status: 'none', note: 'Sem resultado nesta fonte' }
    ];
    const matches = rows.map((r, i) => {
      const skipped = r.status === 'none' || !!off[i];
      const color = r.status === 'ok' ? '#7CF0C9' : (r.status === 'review' ? '#F2A65A' : '#FF5A4E');
      return {
        title: r.title, note: skipped && r.status !== 'none' ? 'Ignorado' : r.note,
        on: !skipped,
        op: skipped ? 0.55 : 1,
        noteColor: r.status === 'ok' ? '#7CF0C9' : (r.status === 'review' ? '#F2A65A' : '#FF8A80'),
        line: skipped ? 'rgba(255,255,255,.1)' : color + '66',
        tickBg: skipped ? 'rgba(255,255,255,.18)' : color,
        tick: skipped ? 'M7 12h10' : 'M5 12.5l4.5 4.5L19 7.5',
        toggle: () => { if (r.status === 'none') return; const o = Object.assign({}, off); o[i] = !o[i]; this.setState({ off: o }); }
      };
    });
    const count = matches.filter((m) => m.on).length;
    const labels = ['Progresso de leitura', 'Categorias', 'Trackers', 'Manter os capítulos baixados'];
    const opts = labels.map((label, i) => ({
      label, on: !!opt[i],
      bg: opt[i] ? '#F2A65A' : 'rgba(255,255,255,.18)',
      left: opt[i] ? 25 : 3,
      knob: opt[i] ? '#0F0E11' : '#F4F0EA',
      toggle: () => { const o = Object.assign({}, opt); o[i] = !o[i]; this.setState({ opt: o }); }
    }));
    return {
      opts, matches, count,
      arrowBg: phase === 2 ? '#7CF0C9' : '#F2A65A',
      running: phase === 1,
      pct: 66,
      ctaLabel: phase === 0 ? 'Migrar ' + count + ' títulos' : (phase === 1 ? 'Migrando… toque para cancelar' : 'Migração concluída · ver estante'),
      ctaBg: phase === 0 ? '#F2A65A' : (phase === 1 ? 'rgba(255,255,255,.14)' : '#7CF0C9'),
      ctaFg: phase === 1 ? '#F4F0EA' : '#0F0E11',
      go: () => this.setState({ phase: phase === 0 ? 1 : (phase === 1 ? 0 : 0) })
    };
  }
}
</script>
</body>
</html>
