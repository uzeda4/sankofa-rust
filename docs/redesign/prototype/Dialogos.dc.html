<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Diálogos de confirmação</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <!-- blurred backdrop: library grid -->
  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 20% -6%,rgba(242,166,90,.36),transparent 62%),#0F0E11"></div>
  <div style="position:absolute;inset:0;padding:60px 16px;box-sizing:border-box;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;filter:blur(6px);opacity:.7">
    <div style="height:210px;border-radius:18px;background:linear-gradient(160deg,#1B3A4B,#0B1820)"></div>
    <div style="height:210px;border-radius:18px;background:linear-gradient(160deg,#3B1F4A,#150B1C)"></div>
    <div style="height:210px;border-radius:18px;background:linear-gradient(160deg,#0F2B2A,#050F0F)"></div>
    <div style="height:210px;border-radius:18px;background:linear-gradient(160deg,#4A3A2A,#1E1710)"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(5,5,7,.58)"></div>

  <!-- dialog -->
  <div role="alertdialog" aria-labelledby="dtitle" aria-describedby="dtext" style="position:absolute;left:20px;right:20px;top:230px;border-radius:30px;padding:24px;display:flex;flex-direction:column;gap:14px;background:rgba(28,25,33,.9);backdrop-filter:blur(30px) saturate(1.5);border:1px solid rgba(255,255,255,.16);box-shadow:0 40px 60px -24px rgba(0,0,0,.8);transform:{{tf}};opacity:{{op}};transition:all 400ms cubic-bezier(.2,.8,.2,1)">
    <span style="width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:{{soft}};color:{{color}}">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icon}}"/></svg>
    </span>
    <span id="dtitle" style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:26px;line-height:1.1">{{title}}</span>
    <span id="dtext" style="font-size:15.5px;line-height:1.5;color:rgba(244,240,234,.82)">{{text}}</span>
    <button onClick="{{toggleCheck}}" role="checkbox" aria-checked="{{checked}}" style="min-height:52px;padding:0 12px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#F4F0EA;display:flex;align-items:center;gap:12px;font-weight:700;font-size:14.5px;text-align:left">
      <span style="width:26px;height:26px;border-radius:8px;border:2px solid {{color}};display:grid;place-items:center;background:{{checkBg}};color:#0F0E11;flex:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity:{{checkOp}}"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      {{checkLabel}}
    </button>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button onClick="{{cancel}}" style="flex:1;height:56px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#F4F0EA;font-weight:700;font-size:15.5px">Cancelar</button>
      <button onClick="{{confirm}}" style="flex:1;height:56px;border-radius:18px;border:0;background:{{color}};color:#0F0E11;font-weight:800;font-size:15.5px">{{confirmLabel}}</button>
    </div>
  </div>

  <!-- result toast -->
  <div style="position:absolute;left:20px;right:20px;top:176px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(28,25,33,.92);border:1px solid rgba(124,240,201,.5);color:#7CF0C9;font-weight:700;font-size:14.5px;opacity:{{toastOp}};transform:{{toastTf}};transition:all 400ms cubic-bezier(.2,.8,.2,1)">Pronto</div>

  <!-- prototype-only switcher -->
  <div style="position:absolute;left:12px;right:12px;bottom:16px;display:flex;padding:4px;gap:4px;border-radius:20px;background:rgba(24,22,28,.7);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(24px)">
    <sc-for list="{{variants}}" as="v" hint-placeholder-count="3">
      <button onClick="{{v.pick}}" style="flex:1;min-height:52px;border-radius:16px;border:0;background:{{v.bg}};color:{{v.fg}};font-weight:700;font-size:12.5px;line-height:1.2;padding:0 6px;transition:all 300ms ease">{{v.label}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const v = S.v ?? 0;
    const open = S.open ?? true;
    const done = !!S.done;
    const checked = !!S.checked;
    const rgba = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const defs = [
      { label: 'Remover da estante', title: 'Remover da estante?', text: 'Maré de Cinzas sai da sua biblioteca. Seu histórico de leitura continua guardado.', check: 'Apagar também os capítulos baixados', confirm: 'Remover', color: '#FF8A80', icon: 'M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12' },
      { label: 'Apagar downloads', title: 'Apagar 1,2 GB?', text: 'Os capítulos baixados de Maré de Cinzas serão removidos do aparelho. Você pode baixar de novo depois.', check: 'Manter os capítulos que ainda não li', confirm: 'Apagar', color: '#F2A65A', icon: 'M12 4v12m0 0l-5-5m5 5l5-5M5 20h14' },
      { label: 'Restaurar backup', title: 'Restaurar este backup?', text: 'A biblioteca atual será substituída pelo backup de 10 de outubro. Faça um backup agora se quiser voltar atrás.', check: 'Criar backup antes de restaurar', confirm: 'Restaurar', color: '#8FB4FF', icon: 'M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 9.5 4 4 0 0 1 17 18zM12 11v6m0-6l-2.5 2.5M12 11l2.5 2.5' }
    ];
    const d = defs[v];
    const variants = defs.map((x, i) => ({
      label: x.label,
      pick: () => this.setState({ v: i, open: true, done: false, checked: false }),
      bg: v === i ? d.color : 'transparent', fg: v === i ? '#0F0E11' : '#F4F0EA'
    }));
    return {
      variants,
      title: d.title, text: d.text, color: d.color, icon: d.icon,
      soft: rgba(d.color, 0.18),
      checkLabel: d.check,
      confirmLabel: d.confirm,
      checked,
      checkBg: checked ? d.color : 'transparent',
      checkOp: checked ? 1 : 0,
      op: open ? 1 : 0,
      tf: open ? 'translateY(0) scale(1)' : 'translateY(24px) scale(.96)',
      toastOp: done ? 1 : 0,
      toastTf: done ? 'translateY(0)' : 'translateY(-12px)',
      toggleCheck: () => this.setState({ checked: !checked }),
      cancel: () => this.setState({ open: false, done: false }),
      confirm: () => this.setState({ open: false, done: true })
    };
  }
}
</script>
</body>
</html>
