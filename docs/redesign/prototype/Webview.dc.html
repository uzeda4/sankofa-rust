<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 40% at 50% -6%,rgba(143,180,255,.22),transparent 62%),#0F0E11"></div>

  <!-- top bar -->
  <div style="position:absolute;left:12px;right:12px;top:12px;height:64px;border-radius:22px;padding:0 8px;display:flex;align-items:center;gap:6px;background:rgba(24,22,28,.66);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.5)">
    <a href="Erros.dc.html" aria-label="Fechar" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#F4F0EA;flex:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="flex:1;min-width:0;height:44px;border-radius:14px;padding:0 12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7CF0C9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z"/></svg>
      <span style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">aurora-scans.example</span>
    </div>
    <button aria-label="Recarregar" style="width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:#F4F0EA;display:grid;place-items:center;flex:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
    </button>
  </div>
  <div style="position:absolute;left:24px;right:24px;top:80px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden"><div style="width:{{load}}%;height:100%;background:#8FB4FF;transition:width 700ms ease"></div></div>

  <!-- page content -->
  <div style="position:absolute;left:16px;right:16px;top:112px;bottom:112px;display:flex;align-items:center;justify-content:center">
    <div style="width:100%;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:16px;background:#F1ECE2;color:#141414;box-shadow:0 30px 50px -24px rgba(0,0,0,.8)">
      <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:26px;line-height:1.1">Verificando seu navegador</span>
      <span style="font-size:15.5px;line-height:1.5;color:#3A3A3A">Este site precisa confirmar que você é uma pessoa antes de mostrar os capítulos.</span>
      <button onClick="{{verify}}" role="checkbox" aria-checked="{{ok}}" style="min-height:64px;padding:0 16px;border-radius:16px;border:2px solid #141414;background:#FFFFFF;color:#141414;display:flex;align-items:center;gap:14px;font-weight:700;font-size:16px;text-align:left">
        <span style="width:30px;height:30px;border-radius:8px;border:2px solid #141414;display:grid;place-items:center;background:{{boxBg}};color:#FFFFFF;flex:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity:{{tickOp}}"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
        {{boxLabel}}
      </button>
    </div>
  </div>

  <!-- bottom bar -->
  <div style="position:absolute;left:12px;right:12px;bottom:16px;height:72px;border-radius:26px;padding:0 10px;display:flex;align-items:center;gap:6px;background:rgba(24,22,28,.66);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.5)">
    <button aria-label="Voltar página" style="width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:#F4F0EA;display:grid;place-items:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button aria-label="Avançar página" style="width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:#F4F0EA;display:grid;place-items:center;opacity:.45">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button aria-label="Abrir no navegador" style="width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:#F4F0EA;display:grid;place-items:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg>
    </button>
    <a href="Erros.dc.html" style="margin-left:auto;height:48px;padding:0 20px;border-radius:16px;background:{{doneBg}};color:{{doneFg}};font-weight:800;font-size:15px;text-decoration:none;display:flex;align-items:center;pointer-events:{{donePE}};transition:all 300ms ease">Concluir</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const ok = !!S.ok;
    return {
      ok,
      load: ok ? 100 : 46,
      boxBg: ok ? '#1F8A5B' : '#FFFFFF',
      tickOp: ok ? 1 : 0,
      boxLabel: ok ? 'Verificado' : 'Confirmo que sou uma pessoa',
      verify: () => this.setState({ ok: !ok }),
      doneBg: ok ? '#8FB4FF' : 'rgba(255,255,255,.12)',
      doneFg: ok ? '#0F0E11' : 'rgba(244,240,234,.6)',
      donePE: ok ? 'auto' : 'none'
    };
  }
}
</script>
</body>
</html>
