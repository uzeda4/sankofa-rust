<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Armazenamento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0E11}
button{font-family:inherit;cursor:pointer}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0F0E11;color:#F4F0EA;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;inset:0;background:radial-gradient(120% 50% at 85% -6%,rgba(124,240,201,.28),transparent 62%),radial-gradient(90% 45% at 0% 55%,rgba(15,43,42,.9),transparent 70%),#0F0E11"></div>

  <div class="scroll" style="position:absolute;inset:0;overflow-y:auto;padding:20px 16px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">

    <div style="display:flex;align-items:center;gap:12px">
      <a href="Downloads.dc.html" aria-label="Voltar" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(14px);color:#F4F0EA;display:grid;place-items:center;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 style="margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.05">Armazenamento</h1>
    </div>

    <div style="border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(135deg,rgba(124,240,201,.2),rgba(15,43,42,.7));border:1px solid rgba(124,240,201,.4)">
      <span style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:34px;line-height:1">{{total}}</span>
      <span style="font-size:14px;color:rgba(244,240,234,.8)">usados por capítulos baixados</span>
      <button onClick="{{clearRead}}" style="height:48px;border-radius:16px;border:0;background:#7CF0C9;color:#0F0E11;font-weight:800;font-size:15px">Apagar capítulos lidos ({{readSize}})</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,240,234,.72);font-weight:700">Por título</span>
      <sc-for list="{{items}}" as="t" hint-placeholder-count="5">
        <div style="padding:12px 8px 12px 14px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px;opacity:{{t.op}};transition:opacity 300ms ease">
          <span style="display:flex;flex-direction:column;gap:8px;flex:1;min-width:0">
            <span style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
              <span style="font-weight:700;font-size:15.5px">{{t.title}}</span>
              <span style="font-weight:800;font-size:14px;color:{{t.color}}">{{t.size}}</span>
            </span>
            <span style="height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden"><span style="display:block;width:{{t.pct}}%;height:100%;border-radius:4px;background:{{t.color}};transition:width 500ms cubic-bezier(.2,.8,.2,1)"></span></span>
          </span>
          <button onClick="{{t.del}}" aria-label="Apagar downloads de {{t.title}}" style="width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#F4F0EA;display:grid;place-items:center;flex:none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>
          </button>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const del = S.del || {};
    const readCleared = !!S.readCleared;
    const base = [
      { title: 'Maré de Cinzas', mb: 1180, read: 720, color: '#F2A65A' },
      { title: 'Ronin Neon', mb: 940, read: 310, color: '#7CF0C9' },
      { title: 'Lótus de Ferro', mb: 610, read: 200, color: '#FF5A4E' },
      { title: 'Clube do Último Sino', mb: 380, read: 380, color: '#8FB4FF' },
      { title: 'Café Lua de Papel', mb: 120, read: 40, color: '#F4D58D' }
    ];
    const fmt = (mb) => mb >= 1000 ? (mb / 1000).toFixed(1).replace('.', ',') + ' GB' : mb + ' MB';
    const sized = base.map((d, i) => {
      const cur = del[i] ? 0 : (readCleared ? d.mb - d.read : d.mb);
      return Object.assign({}, d, { cur, i });
    });
    const max = Math.max.apply(null, base.map((d) => d.mb));
    const total = sized.reduce((s, d) => s + d.cur, 0);
    const readTotal = base.reduce((s, d, i) => s + (del[i] ? 0 : d.read), 0);
    const items = sized.map((d) => ({
      title: d.title, color: d.color,
      size: fmt(d.cur),
      pct: Math.round(d.cur / max * 100),
      op: d.cur === 0 ? 0.5 : 1,
      del: () => { const n = Object.assign({}, del); n[d.i] = true; this.setState({ del: n }); }
    }));
    return {
      items,
      total: fmt(total),
      readSize: readCleared ? '0 MB' : fmt(readTotal),
      clearRead: () => this.setState({ readCleared: true })
    };
  }
}
</script>
</body>
</html>
