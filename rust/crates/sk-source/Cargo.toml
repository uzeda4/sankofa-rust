[package]
name = "sk-source"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek = "3.0.0"
md-5 = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
wasmi = "2.0.0"

[dev-dependencies]
wat = "1"

[features]
# `testing::Curl`: an `Http` over the `curl` binary, for running sources against live sites from the PC.
testing = []

[[test]]
name = "mangadex"
required-features = ["testing"]
