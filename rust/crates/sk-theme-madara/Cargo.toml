[package]
name = "sk-theme-madara"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Madara (WordPress manga theme with admin-ajax listings) sites for Sankofa sources"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["block-padding"] }
fancy-regex = "0.19"
md-5 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sk-source-sdk = { version = "0.1.0", path = "../sk-source-sdk" }
