[workspace]
resolver = "2"
members = ["crates/*", "sources/mangadex", "sources/mangakakalot", "sources/murimscan", "sources/arenascans", "sources/asmotoon", "sources/mangafox", "sources/mangademon", "sources/webtoons", "sources/asurascans", "sources/mangafire", "sources/bench"]
# The host has no C compiler (GNU toolchain only); crates with C code build for Android with `-p`.
default-members = ["crates/sk-model"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
lto = "thin"
opt-level = 3
strip = true

