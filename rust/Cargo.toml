[workspace]
resolver = "2"
members = ["crates/*", "sources/*"]
# The host has no C compiler (GNU toolchain only); crates with C code build for Android with `-p`.
default-members = ["crates/sk-model"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
lto = "thin"
opt-level = 3
strip = true


# Source modules (WebAssembly) trade speed for size: `cargo build --profile wasm --target wasm32-unknown-unknown -p sk-source-<name>`.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
